[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ulysses-gpt"
version = "0.1.0"
description = "ulysses-gpt: a PyTorch decoder-only GPT with Hugging Face export"
authors = [ { name = "Ulyssesllc", email = "trannhatuy2006pbc@gmail.com" } ]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2.0",
    "tiktoken>=0.6.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "tqdm>=4.66.0",
    "datasets>=2.19.0",
    "transformers>=4.40.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = [ "mypy>=1.10.0", "pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.5.0", ]

[project.scripts]
mini-gpt = "src.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mini_gpt*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disable_error_code = ["misc"]
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
